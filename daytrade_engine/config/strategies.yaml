  allowed_regimes: [BREAKOUT_EXPANSION, TREND_UP, TREND_DOWN]
  primary_or_minutes: 5
  confirm_or_minutes: 15
  min_breakout_volume_ratio: 1.8
  min_rvol: 2.0
  target_1_r: 1.0
  target_2_r: 2.0
relative_strength_leader:
  enabled: true
  allowed_regimes: [TREND_UP, TREND_DOWN, BREAKOUT_EXPANSION]
